<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cqcdraft1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>xin chao</h1>
  <p>day la trang web writing</p>
  <button type="button">bắt đầu viết</button>

  <section class="task2">
    <h2>Writing Task 2</h2>
    <p class="prompt">
      Some people believe that universities should focus on providing academic
      knowledge, while others think they should prepare students for future jobs.
      Discuss both views and give your own opinion.
      Write at least 250 words.
    </p>
    <label for="essay">Bài viết của bạn:</label>
    <textarea id="essay" name="essay" placeholder="Bắt đầu viết bài ở đây..."></textarea>
    <p id="word-count" class="word-count" aria-live="polite">0 words</p>
  </section>
</body>
</html>
